  <g transform="translate(98, 12)">
    <text x="0" y="30" 
          font-family="'Montserrat', 'Arial Black', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="28.5" 
          font-weight="900" 
          letter-spacing="-0.3" 
          fill="#ffffff">
      ASSURANCES ECHKILI
    </text>

    <text x="1" y="52" 
          font-family="'Montserrat', 'Arial', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="14.2" 
          font-weight="800" 
          letter-spacing="2.6" 
          fill="#ff384d">
      AGENT GÉNÉRAL AXA MARRAKECH
    </text>
  </g>
</svg>
