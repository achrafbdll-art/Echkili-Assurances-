<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <g fill="none" stroke="#6366f1" stroke-width="0.8" opacity="0.22" stroke-linecap="round" stroke-linejoin="round">
    <!-- Grid borders -->
    <rect x="0" y="0" width="64" height="64" />
    
    <!-- Central Octagon with chamfered corners -->
    <polygon points="20,8 44,8 56,20 56,44 44,56 20,56 8,44 8,20" />
    
    <!-- 8-pointed star rosette inside center -->
    <rect x="22" y="22" width="20" height="20" />
    <rect x="22" y="22" width="20" height="20" transform="rotate(45 32 32)" />
    
    <!-- Diagonal lattice lines connecting corners through center -->
    <line x1="0" y1="0" x2="64" y2="64" stroke-width="0.6" />
    <line x1="64" y1="0" x2="0" y2="64" stroke-width="0.6" />
    
    <!-- Orthogonal cross lines -->
    <line x1="32" y1="0" x2="32" y2="64" stroke-width="0.5" stroke-dasharray="2 3" />
    <line x1="0" y1="32" x2="64" y2="32" stroke-width="0.5" stroke-dasharray="2 3" />
    
    <!-- Corner diamonds (intersections of adjacent octagons) -->
    <polygon points="0,-12 12,0 0,12 -12,0" />
    <polygon points="64,-12 76,0 64,12 52,0" />
    <polygon points="0,52 12,64 0,76 -12,64" />
    <polygon points="64,52 76,64 64,76 52,64" />
    
    <!-- Outer accent dots -->
    <circle cx="32" cy="32" r="1.5" fill="#e0101b" fill-opacity="0.3" stroke="none" />
  </g>
</svg>
