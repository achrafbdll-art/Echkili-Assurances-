<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <!-- Wall and Room Lighting Gradients -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <linearGradient id="backWallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Wood Slats and Furniture Gradients -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <linearGradient id="deskWood" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#c27803"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>

    <linearGradient id="deskFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Glass & Screen Reflections -->
    <linearGradient id="screenGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="ceilingLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.16"/>
    </filter>

    <filter id="deskShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background: Room Walls & Floor -->
  <rect width="1200" height="900" fill="url(#wallGrad)"/>

  <!-- Back Room Wall (Reception Area with AXA Logo) -->
  <rect x="580" y="240" width="620" height="420" fill="url(#backWallGrad)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Floor Area -->
  <polygon points="0,680 1200,660 1200,900 0,900" fill="url(#floorGrad)"/>

  <!-- Left Main Wall -->
  <polygon points="0,0 500,0 500,720 0,760" fill="#f8fafc"/>

  <!-- Ceiling Beam & Accent -->
  <polygon points="500,160 1200,160 1200,240 500,240" fill="#334155"/>
  <rect x="500" y="235" width="700" height="6" fill="#002868"/>

  <!-- Ceiling LED Square Light -->
  <rect x="860" y="265" width="105" height="28" rx="4" fill="url(#ceilingLight)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="872" y="270" width="81" height="18" fill="#ffffff" opacity="0.95"/>

  <!-- ================= WOODEN SLATTED DIVIDER PARTITION ================= -->
  <!-- Header Beam of Slats -->
  <rect x="500" y="160" width="80" height="420" fill="url(#woodGrad)" filter="url(#softShadow)"/>
  <!-- Vertical Wood Slats -->
  <g fill="url(#woodGrad)">
    <rect x="504" y="160" width="8" height="420"/>
    <rect x="516" y="160" width="8" height="420"/>
    <rect x="528" y="160" width="8" height="420"/>
    <rect x="540" y="160" width="8" height="420"/>
    <rect x="552" y="160" width="8" height="420"/>
    <rect x="564" y="160" width="8" height="420"/>
  </g>

  <!-- ================= LEFT WALL FRAMED AXA POSTER ================= -->
  <g filter="url(#softShadow)">
    <!-- Silver/Aluminum Frame -->
    <rect x="250" y="160" width="165" height="265" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
    <!-- Poster Background -->
    <rect x="256" y="166" width="153" height="253" rx="3" fill="#fafaf9"/>
    <!-- Poster Image Simulation (Home insurance interior) -->
    <rect x="262" y="172" width="141" height="135" fill="#f5ebe0" rx="2"/>
    <circle cx="280" cy="205" r="14" fill="#d97706" opacity="0.3"/>
    <rect x="270" y="230" width="70" height="45" rx="3" fill="#b45309" opacity="0.4"/>
    <rect x="345" y="220" width="50" height="55" rx="3" fill="#78350f" opacity="0.3"/>
    <!-- Poster Arabic Text Simulation -->
    <rect x="265" y="320" width="105" height="7" rx="3" fill="#e0021b"/>
    <rect x="265" y="333" width="125" height="5" rx="2" fill="#334155"/>
    <rect x="265" y="343" width="95" height="5" rx="2" fill="#64748b"/>
    <rect x="265" y="358" width="60" height="18" rx="4" fill="#002868"/>
    <!-- AXA logo mark on poster -->
    <text x="375" y="405" font-family="Arial, sans-serif" font-weight="900" font-size="12" fill="#002868">AXA</text>
  </g>

  <!-- ================= BACKGROUND AXA LOGO ON WHITE WALL ================= -->
  <g transform="translate(830, 360)">
    <!-- AXA Typography -->
    <path d="M 0 65 L 22 5 L 42 5 L 64 65 L 46 65 L 40 47 L 24 47 L 18 65 Z M 27 34 L 37 34 L 32 18 Z" fill="#002868"/>
    <path d="M 52 5 L 72 5 L 88 33 L 104 5 L 124 5 L 98 42 L 126 65 L 106 65 L 88 37 L 70 65 L 50 65 L 78 40 Z" fill="#002868"/>
    <path d="M 116 65 L 138 5 L 158 5 L 180 65 L 162 65 L 156 47 L 140 47 L 134 65 Z M 143 34 L 153 34 L 148 18 Z" fill="#002868"/>
    <!-- AXA Red Diagonal Slash Accent -->
    <polygon points="166,-10 188,-10 148,82 126,82" fill="#e0021b"/>
  </g>

  <!-- Background Decorative Vases & Plant on Counter -->
  <rect x="770" y="515" width="220" height="75" rx="4" fill="url(#deskWood)" filter="url(#softShadow)"/>
  <!-- Red Flowers Vase -->
  <circle cx="815" cy="485" r="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="810" cy="460" r="10" fill="#e0021b"/>
  <circle cx="822" cy="455" r="8" fill="#ef4444"/>
  <circle cx="815" cy="445" r="9" fill="#b91c1c"/>
  <!-- Blue Vase -->
  <ellipse cx="955" cy="485" rx="10" ry="16" fill="#002868"/>
  <circle cx="955" cy="460" r="8" fill="#3b82f6" opacity="0.6"/>

  <!-- Background Secondary Workstation -->
  <rect x="835" y="525" width="80" height="50" rx="3" fill="url(#screenGlass)"/>
  <rect x="868" y="575" width="14" height="15" fill="#64748b"/>
  <rect x="855" y="588" width="40" height="5" rx="2" fill="#475569"/>

  <!-- Background Office Chairs -->
  <ellipse cx="1030" cy="565" rx="34" ry="48" fill="#1e293b" opacity="0.9"/>
  <ellipse cx="1030" cy="625" rx="32" ry="12" fill="#0f172a"/>

  <!-- Printer / Scanner Station on Left Credenza -->
  <g transform="translate(160, 640)" filter="url(#softShadow)">
    <rect x="0" y="45" width="130" height="75" rx="6" fill="#1e293b"/>
    <rect x="15" y="30" width="100" height="20" rx="3" fill="#334155"/>
    <rect x="25" y="15" width="80" height="20" fill="#ffffff"/>
    <circle cx="110" cy="65" r="4" fill="#22c55e"/>
  </g>

  <!-- ================= FOREGROUND EXECUTIVE DESK ================= -->
  <g filter="url(#deskShadow)">
    <!-- Desk Front Apron Panel -->
    <polygon points="370,680 890,660 890,890 370,890" fill="url(#deskFront)"/>
    <!-- Modern Metallic Trim Lines on Desk -->
    <line x1="390" y1="740" x2="870" y2="720" stroke="#f59e0b" stroke-width="2" opacity="0.4"/>
    <line x1="390" y1="800" x2="870" y2="780" stroke="#f59e0b" stroke-width="2" opacity="0.4"/>
    <!-- Desk Top Surface (Rich Oak Grain) -->
    <polygon points="320,680 840,650 940,660 410,720" fill="url(#deskWood)"/>
  </g>

  <!-- Primary Dell Desktop Computer Monitor -->
  <g transform="translate(520, 580)" filter="url(#softShadow)">
    <!-- Screen Bezel -->
    <rect x="0" y="0" width="195" height="125" rx="5" fill="url(#screenGlass)" stroke="#334155" stroke-width="2"/>
    <!-- Screen Glass Active Reflection -->
    <polygon points="12,12 183,12 140,113 12,113" fill="#38bdf8" opacity="0.08"/>
    <!-- Dell Logo Dot -->
    <circle cx="97" cy="118" r="4" fill="#94a3b8"/>
    <!-- Monitor Stand -->
    <rect x="91" y="125" width="14" height="35" fill="#64748b"/>
    <ellipse cx="98" cy="160" rx="35" ry="8" fill="#475569"/>
  </g>

  <!-- Acrylic Brochure Display Stand with AXA Leaflets -->
  <g transform="translate(570, 640)" filter="url(#softShadow)">
    <!-- Transparent Acrylic Stand -->
    <polygon points="0,20 115,10 110,120 -5,130" fill="#ffffff" opacity="0.5" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Front Brochure (Auto Insurance with car picture) -->
    <rect x="6" y="25" width="45" height="75" rx="2" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="9" y="28" width="39" height="25" fill="#002868" rx="1"/>
    <rect x="9" y="58" width="30" height="4" fill="#e0021b"/>
    <rect x="9" y="66" width="35" height="3" fill="#64748b"/>
    <!-- Second Brochure (Health & Family) -->
    <rect x="58" y="20" width="45" height="75" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="61" y="23" width="39" height="25" fill="#059669" rx="1"/>
    <rect x="61" y="53" width="32" height="4" fill="#002868"/>
  </g>

  <!-- Moroccan Mosaic Tissue Box (Handmade Zellij pattern) -->
  <g transform="translate(240, 755)" filter="url(#softShadow)">
    <!-- Box Body -->
    <polygon points="0,20 80,0 125,18 45,38" fill="#0284c7"/>
    <polygon points="0,20 45,38 45,75 0,55" fill="#0369a1"/>
    <polygon points="45,38 125,18 125,55 45,75" fill="#075985"/>
    <!-- Zellij geometric star motifs -->
    <circle cx="22" cy="40" r="6" fill="#facc15" opacity="0.8"/>
    <circle cx="85" cy="40" r="6" fill="#facc15" opacity="0.8"/>
    <!-- White Tissue coming out of top slit -->
    <path d="M 50 15 Q 65 -8 75 10 Q 80 5 85 14 Z" fill="#ffffff" filter="url(#softShadow)"/>
  </g>

  <!-- Pen Stand & Desk Accessories -->
  <g transform="translate(465, 715)">
    <cylinder cx="15" cy="30" rx="12" ry="6" fill="#0f172a"/>
    <rect x="3" y="10" width="24" height="25" rx="3" fill="#334155"/>
    <!-- Red and Blue Pens sticking out -->
    <line x1="8" y1="12" x2="2" y2="-12" stroke="#e0021b" stroke-width="3" stroke-linecap="round"/>
    <line x1="15" y1="12" x2="16" y2="-15" stroke="#002868" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="20" y1="12" x2="26" y2="-10" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Desk Folders (AXA Blue & Yellow Dossiers) -->
  <g transform="translate(710, 620)" filter="url(#softShadow)">
    <!-- Yellow Dossier -->
    <polygon points="0,25 95,10 135,30 40,45" fill="#eab308"/>
    <!-- AXA Blue Dossier on top -->
    <polygon points="10,15 100,2 140,22 50,35" fill="#002868"/>
    <rect x="55" y="12" width="40" height="8" fill="#ffffff" opacity="0.8" rx="1"/>
  </g>

  <!-- Foreground Ergonomic Mesh Executive Office Chairs -->
  <!-- Chair 1 (Left Desk Chair) -->
  <g transform="translate(450, 600)" opacity="0.95">
    <ellipse cx="60" cy="50" rx="38" ry="50" fill="#1e293b" filter="url(#softShadow)"/>
    <rect x="22" y="10" width="76" height="75" rx="16" fill="#0f172a"/>
    <!-- Mesh Texture Lines -->
    <line x1="32" y1="30" x2="88" y2="30" stroke="#334155" stroke-width="1.5"/>
    <line x1="32" y1="45" x2="88" y2="45" stroke="#334155" stroke-width="1.5"/>
    <line x1="32" y1="60" x2="88" y2="60" stroke="#334155" stroke-width="1.5"/>
  </g>

  <!-- Chair 2 (Right Foreground Client/Advisor Chair) -->
  <g transform="translate(850, 610)" filter="url(#deskShadow)">
    <!-- Mesh Backrest -->
    <path d="M 30,20 C 30,0 150,0 150,20 L 140,160 C 140,180 40,180 40,160 Z" fill="#0f172a"/>
    <!-- Ergonomic Lumbar Support Arch -->
    <path d="M 40,90 Q 90,110 140,90" stroke="#475569" stroke-width="6" fill="none"/>
    <!-- Armrests -->
    <rect x="15" y="95" width="22" height="60" rx="8" fill="#1e293b"/>
    <rect x="145" y="95" width="22" height="60" rx="8" fill="#1e293b"/>
    <!-- Padded Seat Cushion -->
    <ellipse cx="90" cy="180" rx="70" ry="24" fill="#020617"/>
  </g>

  <!-- Subtle Bottom Branding Badge Overlay -->
  <g transform="translate(40, 840)">
    <rect x="0" y="0" width="260" height="38" rx="8" fill="#002868" opacity="0.92"/>
    <text x="14" y="24" font-family="Arial, sans-serif" font-weight="800" font-size="14" fill="#ffffff" letter-spacing="0.5">ECHKILI ASSURANCES</text>
    <rect x="210" y="10" width="36" height="18" rx="3" fill="#e0021b"/>
    <text x="215" y="23" font-family="Arial, sans-serif" font-weight="900" font-size="11" fill="#ffffff">AXA</text>
  </g>
</svg>
